# Unsigned IPA for AltStore (ios-distribution/, docs/ALTSTORE.md).
# Releases are built in the public repository tera-works/tera-synth-ios-build
# (free minutes): `python ios-distribution/scripts/mirror_build.py vX.Y.Z` pushes
# the source snapshot and the tag there, then publish_public.py publishes the IPA.
# This private copy runs by hand only (macOS minutes count 10x here).
name: iOS distribution
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-distribution-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen
      - run: python3 ios-distribution/scripts/distribute.py build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: dist/*
          if-no-files-found: error
          retention-days: 30
